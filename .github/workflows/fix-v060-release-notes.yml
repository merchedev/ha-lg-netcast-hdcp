name: Fix v0.6.0 release notes

on:
  push:
    branches:
      - AI-Developer

permissions:
  contents: write

jobs:
  fix:
    name: Update v0.6.0 release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v0.6.0 release notes
        run: >-
          python3 tools/extract_release_notes.py
          --tag v0.6.0
          --output release-notes.md
      - name: Update v0.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.6.0 --notes-file release-notes.md
