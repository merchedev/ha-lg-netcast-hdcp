name: Fix v0.6.0 release notes

on:
  push:
    branches:
      - AI-Developer

permissions:
  contents: write

jobs:
  fix:
    name: Update v0.6.0 release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.6.0
      - name: Extract v0.6.0 release notes
        run: >-
          python3 tools/extract_release_notes.py
          --tag v0.6.0
          --output release-notes.md
      - name: Update v0.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            gh --version
            gh auth status
            gh release view v0.6.0 --json id,tagName,isDraft
            gh release edit v0.6.0 --notes-file release-notes.md
          } > gh-output.txt 2>&1
          status=$?
          cat gh-output.txt
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < gh-output.txt
            exit "$status"
          fi
