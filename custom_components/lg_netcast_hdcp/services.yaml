process_ir_key:
  name: Process IR key
  description: >-
    Update the television state from a key received by an external IR receiver.
    The key is not sent to the television.
  target:
    entity:
      domain: media_player
      integration: lg_netcast_hdcp
  fields:
    key:
      name: Key
      description: >-
        Key name such as POWER, INPUT, OK, NUMBER_1, HDMI1, or UP, or a
        two-digit decimal code from 00 to 99.
      required: true
      example: INPUT
      selector:
        select:
          custom_value: true
          options:
            - POWER
            - INPUT
            - OK
            - LEFT
            - RIGHT
            - UP
            - DOWN
            - HOME
            - EXIT
            - MUTE
            - VOLUME_UP
            - VOLUME_DOWN
            - CHANNEL_UP
            - CHANNEL_DOWN
            - NUMBER_0
            - NUMBER_1
            - NUMBER_2
            - NUMBER_3
            - NUMBER_4
            - NUMBER_5
            - NUMBER_6
            - NUMBER_7
            - NUMBER_8
            - NUMBER_9
            - HDMI1
            - HDMI2
            - HDMI3
            - HDMI4
            - AV1
